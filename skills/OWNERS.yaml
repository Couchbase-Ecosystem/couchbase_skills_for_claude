# Skill ownership
#
# Every skill under skills/ must have an entry here.
#
#   name                 the skill directory name
#   dris                 one or two GitHub usernames, no leading @; the first is primary
#   last_reviewed        ISO date (YYYY-MM-DD) of the last content review
#   review_cadence_days  how often the content must be re-verified against docs.couchbase.com
#
# Skills in this repository carry version-sensitive product facts, so an unreviewed
# skill decays. Treat an overdue last_reviewed as a bug, not a formality.
#
# The DRI on every skill below is an INTERIM assignment carried over from the
# donation of this collection. Reassign each skill to the team that owns the
# surface it documents -- mobile to the mobile team, the Operator skill to the
# Kubernetes team, and so on -- as those owners are identified.

